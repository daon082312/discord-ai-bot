<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>VALORANT AI Coach</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<main class="container">
    <header>
        <div class="eyebrow">POST-GAME ANALYSIS</div>
        <h1>VALORANT AI COACH</h1>
        <p class="subtitle">
            클립을 올리면 Aim, Movement, Positioning,
            Utility와 Decision Making을 분석합니다.
        </p>
    </header>

    <section class="panel">
        <label id="dropZone" class="drop-zone">
            <input id="videoInput" type="file" accept="video/*">
            <div class="drop-title">클립 선택 / 드래그</div>
            <div id="fileName" class="muted">MP4 권장</div>
        </label>

        <video id="videoPlayer" controls playsinline></video>
        <button id="analyzeBtn" class="primary" disabled>AI 분석 시작</button>
        <div id="status" class="status"></div>
    </section>

    <section id="results" class="hidden">
        <div class="score-card">
            <div>
                <div class="muted">OVERALL SCORE</div>
                <div id="overallScore" class="overall-score">--</div>
            </div>
            <div id="summary" class="summary"></div>
        </div>

        <section class="panel">
            <h2>영역별 점수</h2>
            <div id="scoreBars"></div>
        </section>

        <section class="panel">
            <h2>가장 먼저 개선할 것</h2>
            <ol id="priorities"></ol>
        </section>

        <section class="panel">
            <h2>주요 장면</h2>
            <p class="muted">
                타임스탬프를 누르면 해당 장면으로 이동합니다.
                각 코칭 내용에 👍/👎 평가를 남길 수 있습니다.
            </p>
            <div id="events"></div>
        </section>

        <section class="panel">
            <h2>분석 한계</h2>
            <ul id="limitations"></ul>
        </section>

        <section class="panel feedback-panel">
            <div class="eyebrow">YOUR FEEDBACK</div>
            <h2>이 분석은 어땠나요?</h2>

            <div class="feedback-grid">
                <button class="feedback-choice" data-rating="helpful">정확했습니다</button>
                <button class="feedback-choice" data-rating="partial">일부만 맞았습니다</button>
                <button class="feedback-choice" data-rating="not_helpful">대부분 틀렸습니다</button>
            </div>

            <div class="categories">
                <strong>어떤 부분에 대한 의견인가요?</strong>
                <label><input type="checkbox" value="aim"> Aim</label>
                <label><input type="checkbox" value="movement"> Movement</label>
                <label><input type="checkbox" value="positioning"> Positioning</label>
                <label><input type="checkbox" value="utility"> Utility</label>
                <label><input type="checkbox" value="decision_making"> Decision Making</label>
            </div>

            <textarea id="overallComment"
                maxlength="2000"
                placeholder="추가 의견을 입력하세요."></textarea>

            <button id="submitOverallFeedback"
                    class="secondary"
                    disabled>피드백 보내기</button>

            <div id="overallFeedbackStatus" class="feedback-status"></div>
        </section>
    </section>
</main>

<script src="/static/app.js"></script>
</body>
</html>
